[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aip-canonica"
version = "0.1.0"
description = "Turn business documents into business objects."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Arpit Ratan", email = "arpit.ratan@outlook.com" }
]

dependencies = [
    "aip-provider",  # Workspace dependency for document processing
    "aip-utils",     # Shared utilities for AI integration
    "openpyxl>=3.1", # Excel file handling
    "pypdf>=6.19.0", # PDF parsing with vector extraction
]

[tool.uv.sources]
# Workspace dependencies for local package resolution
aip-provider = { workspace = true }
aip-utils = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
# Development dependencies for testing
dev = [
    "pytest>=9.0",         # Testing framework
    "pytest-asyncio>=1.0", # Async testing support
]